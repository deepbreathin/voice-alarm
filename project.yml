# XcodeGen project definition — the canonical source of truth for the Xcode
# project. Regenerate VoiceAlarm.xcodeproj at any time with:
#
#     brew install xcodegen   # once
#     xcodegen generate
#
# (A pre-generated VoiceAlarm.xcodeproj is committed so the project also opens
# by double-click without needing XcodeGen.)
name: VoiceAlarm
options:
  bundleIdPrefix: com.voicealarm
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  VoiceAlarm:
    type: application
    platform: iOS
    sources:
      - path: VoiceAlarm
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.voicealarm.app
        PRODUCT_NAME: VoiceAlarm
        INFOPLIST_FILE: VoiceAlarm/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGNING_ALLOWED: NO

  VoiceAlarmTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: VoiceAlarmTests
    dependencies:
      - target: VoiceAlarm
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.voicealarm.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/VoiceAlarm.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/VoiceAlarm"
        BUNDLE_LOADER: "$(TEST_HOST)"

  VoiceAlarmUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: VoiceAlarmUITests
    dependencies:
      - target: VoiceAlarm
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.voicealarm.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: VoiceAlarm

schemes:
  VoiceAlarm:
    build:
      targets:
        VoiceAlarm: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - VoiceAlarmTests
        - VoiceAlarmUITests
