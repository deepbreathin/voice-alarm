name: Build IPA

# Produces an UNSIGNED .ipa you can sideload (Sideloadly/AltStore re-sign it with
# your own Apple ID at install time). Run it manually from the Actions tab, or
# push a tag like `v1.0` to also publish it as a GitHub Release.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-ipa:
    name: Build unsigned IPA
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -switch /Applications/Xcode.app

      - name: Build app for device (unsigned)
        run: |
          set -o pipefail
          xcodebuild build \
            -project VoiceAlarm.xcodeproj \
            -scheme VoiceAlarm \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS=""

      - name: Package into .ipa
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/VoiceAlarm.app"
          if [ ! -d "$APP_PATH" ]; then echo "App not found at $APP_PATH" >&2; exit 1; fi
          rm -rf Payload VoiceAlarm-unsigned.ipa
          mkdir Payload
          cp -R "$APP_PATH" Payload/
          zip -qry VoiceAlarm-unsigned.ipa Payload
          echo "Built IPA:"; ls -lh VoiceAlarm-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: VoiceAlarm-unsigned-ipa
          path: VoiceAlarm-unsigned.ipa
          if-no-files-found: error

      - name: Publish GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" VoiceAlarm-unsigned.ipa \
            --title "VoiceAlarm ${GITHUB_REF_NAME}" \
            --notes "Unsigned IPA. Install with Sideloadly or AltStore (they re-sign it with your own Apple ID), or build from source. See docs/INSTALL.md for steps and docs/VERIFY-SAFETY.md to confirm it's safe."
